        'malloc_to_godel.txt':{type:'f',perm:'-rw-r--r--',own:'root root',size:2048,mtime:'Jan  1 00:00',content:'From malloc() to G\u00f6del: Building a Programming Language at the Limits of Computation\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nA complete programming language interpreter built in C.\nEvery line visible. Every design decision explicit.\n\nPart I \u2014 The Machine\n  chapter 1: malloc() \u2014 the first allocation\n  chapter 2: lexer \u2014 turning source into tokens\n  chapter 3: recursive descent \u2014 parsing without magic\n  chapter 4: environments \u2014 how names find their values\n  chapter 5: closures \u2014 functions that remember\n\nPart II \u2014 The Limits\n  chapter 6: the halting problem \u2014 what no program can decide\n  chapter 7: G\u00f6del\'s incompleteness \u2014 what no system can prove\n  chapter 8: diagonalization \u2014 Cantor, Turing, Church, one argument\n  chapter 9: the boundary \u2014 reachable from a single malloc()\n\nThe boundary of what any machine can compute turns out to be\nreachable from a single malloc() call and a recursive descent parser.\n\namazon: https://www.amazon.com/dp/B0F6WLLGWP\ngithub: https://github.com/gaidardzhiev/slug'},
        'cell_os_book.txt':{type:'f',perm:'-rw-r--r--',own:'root root',size:2048,mtime:'Jan  1 00:00',content:'Cell OS: An Operating Organism\n\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\nProof driven OS design. Architecture instead of authority.\nOrganisms instead of systems.\n\nA new architectural model where software behaves like life:\nborn, verified, expressed, repaired, and constrained\nby its own structure.\n\nBlending OS design, cryptographic verification, and biological\nmetaphor, the book presents a radical alternative to implicit trust:\nreplacing privilege with proof at every stage.\n\nKey concepts:\n  organelle subsystem \u2014 mitochondria / golgi / lysosome / peroxisome\n  proof chain         \u2014 #E0 through #E10, verified on every boot\n  phenotype hash      \u2014 deterministic identity of the running system\n  dual strand updater \u2014 atomic update with rollback\n  QoS token bucket    \u2014 resource fairness without a scheduler\n  channel graph       \u2014 structured IPC without shared memory\n\namazon: https://www.amazon.com/dp/B0GFD4PVH2\ngithub: https://github.com/gaidardzhiev/cell_os'},

        cell_os:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:4096,mtime:'Jan  1 00:00',content:'# cell_os\n\nCell OS is a boot-to-proof microkernel that exercises its own BIOS-stage loaders,\nhandoff ABI, and kernel genes on x86_64 (PC BIOS) and arm64 (QEMU virt).\nIt emits a deterministic chain of #E0\u2026#E10 log markers, proving the substrate\nclassification, channel graph, organelles, IRQ bridge, update path, observability\nfeed, and release manifest. The same source tree builds the boot media, phenotypes,\nhost tools, and reproducible release tarballs.\n\nlang:   C, ASM, NASM, Make, Python, Shell\ntarget: x86-64 (PC BIOS) + arm64 (QEMU virt)\n\nsubsystems:\n  BIOS stage loaders    \u2014 16-bit real mode \u2192 32-bit protected \u2192 64-bit long mode\n  organelle subsystem   \u2014 mitochondria / golgi / lysosome / peroxisome\n  channel graph         \u2014 structured IPC, no shared memory\n  QoS token bucket      \u2014 per-channel rate limiting\n  IRQ bridge            \u2014 hardware interrupt routing\n  dual strand updater   \u2014 atomic update + rollback\n  parcel codec          \u2014 typed message framing\n  observability feed    \u2014 ring-buffered event stream\n  proof chain           \u2014 deterministic #E0\u2013#E10 on every boot\n\nreproducible:\n  SOURCE_DATE_EPOCH enforced\n  MANIFEST verified\n  phenotype hash stable across builds\n\namazon: https://www.amazon.com/dp/B0GFD4PVH2\ngithub: https://github.com/gaidardzhiev/cell_os'},
        }},
        slug:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:4096,mtime:'Jan  1 00:00',content:'# slug\n\nSlug is a minimalist, interpreted programming language written in C.\nFeatures a lexical analyzer, parser, environment management, and an interpreter\ncapable of evaluating expressions and statements including control flow,\nfunctions, and recursion.\n\nlang:   C, Make\n\nfeatures:\n  hand-written lexer\n  recursive descent parser\n  environment chain (lexical scoping)\n  tree-walking interpreter\n  first-class functions\n  closures\n  higher-order functions\n\nships with:\n  church_numerals.slg   \u2014 lambda calculus in slug\n  ackermann.slg         \u2014 Ackermann function\n  godel.slg             \u2014 G\u00f6del numbering + diagonalization\n  halting_paradox.slg   \u2014 halting problem via diagonalization\n  pure_diag.slg         \u2014 stack overflow as proof of undecidability\n  palindrome_checker.slg\u2014 general Turing machine simulator\n  collatz.slg           \u2014 Collatz conjecture counter\n  truth_table.slg       \u2014 De Morgan\'s law verification\n\nThe boundary of what Slug can express turns out to be precisely\nthe boundary between numbers and text.\n\namazon: https://www.amazon.com/dp/B0F6WLLGWP\ngithub: https://github.com/gaidardzhiev/slug'},
          'church_numerals.slg':{type:'f',perm:'-rw-r--r--',own:'root root',size:512,mtime:'Jan  1 00:00',content:'# Church numerals in slug\nvar zero  = func(f, x) => x;\nvar one   = func(f, x) => f(x);\nvar two   = func(f, x) => f(f(x));\nvar succ  = func(n, f, x) => f(n(f, x));\nvar add   = func(m, n, f, x) => n(f, m(f, x));\nvar to_int = func(n) => n(func(x) => x + 1, 0);\nvar four  = func(f, x) => succ(three, f, x);\noutn(to_int(zero));\noutn(to_int(one));\noutn(to_int(four));'},
          'halting_paradox.slg':{type:'f',perm:'-rw-r--r--',own:'root root',size:512,mtime:'Jan  1 00:00',content:'# halting paradox in slug\nvar halts = func(prog, input) => { false; };\nvar diagonal = func(f) => {\n    if (halts(f, f)) { diagonal(f); }\n    else { 0; }\n};\nvar paradox = func(haltFunc) => { diagonal(haltFunc); };\nvar result = paradox(diagonal);\noutn(result);'},
        }},
        snail:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:1024,mtime:'Jan  1 00:00',content:'# snail\n\nSlug\'s full feature set compressed into extreme C preprocessor abuse.\nProduced as an obfuscated C entry.\n\nlang:   C, Make\n\n  28-entry perfect hash table for lexing\n  recursive descent in ~400 lines of dense C\n  macro indirection and self-referential data encoding\n  full closures, first-class functions, lexical scoping\n\nReads as noise. Runs as a language.\n\ngithub: https://github.com/gaidardzhiev/snail'},
        }},
        bfelfx64:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:1024,mtime:'Jan  1 00:00',content:'# bfelfx64\n\nBrainfuck \u2192 x86-64 ELF compiler written in C.\nReads BF source one character at a time, emits raw x86-64 machine instructions.\nNo assembler. No libc. No linker.\n\nlang:   C, Make\n\n  loops via jump offset patching on a manual stack\n  30,000 byte tape in .bss\n  fully valid ELF64 executable\n  Linux syscalls for I/O and exit\n\ngithub: https://github.com/gaidardzhiev/bfelfx64'},

        sh2elf:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:1024,mtime:'Jan  1 00:00',content:'# sh2elf\n\nCompiles shell scripts into standalone ELF64 executables for Linux x86_64.\nEmits raw x86-64 machine code. No external assembler. No linker.\n\nlang:   C, Make\n\n  tokenizer, recursive descent parser, code generator\n  handles: pipelines, redirections, conditionals, built-ins\n  string pooling and relocation patching\n  wraps result in a minimal ELF64 binary\n\nusage:\n  ./sh2elf script.sh -o elf.out\n  ./elf.out\n\ngithub: https://github.com/gaidardzhiev/sh2elf'},

        linker0trust:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:1536,mtime:'Jan  1 00:00',content:'# linker0trust\n\nDeliberately malicious ELF64 linker written in C.\nExposes the implicit trust placed in the linker toolchain.\n\nlang:   C, Make\n\n  appends a new PT_LOAD segment containing shellcode\n  hijacks the entry point to the payload\n  stub branch returns to original main() after payload runs\n  binary executes injected code invisibly before host program\n\nDemonstrates supply chain attacks at the toolchain level.\n\n"you trusted your linker. you shouldn\'t have."\n\ngithub: https://github.com/gaidardzhiev/linker0trust\n\nDISCLAIMER: educational and research purposes only.'},
        }},
        crt0trust:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:1536,mtime:'Jan  1 00:00',content:'# crt0trust\n\nKen Thompson\'s Trusting Trust attack, implemented.\nReverse shell payload embedded in crt0 ARMv8l startup assembly.\nExecutes before main(). strace confirms payload execution.\n\nlang:   C, ASM, Make, Shell\n\nThe "Trusting Trust" attack operates at a profoundly low level\nby subverting the startup assembly itself to insert malicious code\nbefore the program begins. The compiler, the linker, and the loader\nare all clean. The attack lives in crt0.\n\n"You can\'t trust code that you did not totally create yourself."\n\u2014 Ken Thompson, 1984\n\ngithub: https://github.com/gaidardzhiev/crt0trust\n\nDISCLAIMER: educational and research purposes only.'},
        }},
        elfmutator:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:768,mtime:'Jan  1 00:00',content:'# elfmutator\n\nARM32 ELF binary injector.\n\nlang:   C, ASM, Make\n\n  appends shellcode payload as new loadable segment\n  redirects entry point to payload\n  patches stub branch to return to original main()\n  binary executes injected code invisibly before host program\n\n"The moral is obvious. You can\'t trust code that you did not\ntotally create yourself." \u2014 Ken Thompson, 1984\n\ngithub: https://github.com/gaidardzhiev/elfmutator\n\nDISCLAIMER: educational and research purposes only.'},
        }},
        rop:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:768,mtime:'Jan  1 00:00',content:'# rop\n\nARM32 Return Oriented Programming exploit PoC.\nStack buffer overflow \u2192 arbitrary code execution on ARM32 Linux.\nEnvironment: Proot + Termux on Android.\n\nlang:   C, ASM, Shell\n\n  vulnerable program: fixed-size buffer, no stack protection, non-PIE\n  analysis: GDB stack frame inspection\n  gadget discovery: ropper\n  chain construction: manual offset calculation\n  execution: arbitrary code via ROP\n\ngithub: https://github.com/gaidardzhiev/rop\n\nDISCLAIMER: educational and research purposes only.'},
        }},
        isol8r:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{

        ring0fuzzer:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:768,mtime:'Jan  1 00:00',content:'# ring0fuzzer\n\nCPU instruction fuzzer kernel module for x86_64.\nFuzzes raw instructions deep in ring 0.\n\nlang:   C, Make\n\n  generates and executes randomized junk instructions on bare CPU\n  saves and restores every register before/after execution\n  traps #UD (invalid opcode), #GP, #SS, and other faults\n  logs surviving undocumented instructions\n  runs entirely in kernel space \u2014 no user space hand holding\n\nDangerous by design. For controlled environments only.\n\ngithub: https://github.com/gaidardzhiev/ring0fuzzer'},
        }},
        libc:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{
          'readme.md':{type:'f',perm:'-rw-r--r--',own:'root root',size:1024,mtime:'Jan  1 00:00',content:'# libc\n\nFrom scratch libc targeting ARMv8 AArch32 hard-float ABI.\n\nlang:   C, ASM, Make\n\n  printf/vprintf: %s %c %p %d %x %u\n  snprintf/vsnprintf: buffer-bounded formatting\n  fprintf/fputs: direct fd writes\n  malloc/calloc/realloc: free-list allocator with mmap support\n  syscall stubs: SVC 0 direct\n  crt0 startup code\n  linker script\n\nNo host libc. No dependencies.\nFreestanding. Linux ARM syscalls only.\n\ngithub: https://github.com/gaidardzhiev/libc'},
        }},

        oldbox:{type:'d',perm:'drwxr-xr-x',own:'root root',size:4096,mtime:'Jan  1 00:00',content:{

        }},

function resolvePath(cwd,p){
  if(!p||p==='')return cwd;
  const base=p.startsWith('/')?[]:cwd.split('/').filter(Boolean);
  const parts=p.split('/').filter(Boolean);
  for(const s of parts){
    if(s==='.')continue;
    if(s==='..')base.pop();
    else base.push(s);
  }
  return'/'+base.join('/');
}

function getNode(path){
  if(path==='/'||path==='')return FS;
  const parts=path.split('/').filter(Boolean);
  let node=FS;
  for(const p of parts){
    if(!node||node.type!=='d'||!node.content)return null;
    node=node.content[p];
  }
  return node||null;
}

function pathDisplay(cwd){
  if(cwd==='/root'||cwd==='/root/')return'~';
  if(cwd.startsWith('/root/'))return'~/'+cwd.slice(7);
  return cwd;
}

class BFNode{constructor(){this.v=0;this.n=null;this.p=null;}inc(){this.v=(this.v+1)&255;}dec(){this.v=(this.v-1)&255;}}
class BFTape{constructor(){this.c=new BFNode();}right(){if(!this.c.n){const e=new BFNode();e.p=this.c;this.c.n=e;}this.c=this.c.n;}left(){if(!this.c.p){const e=new BFNode();e.n=this.c;this.c.p=e;}this.c=this.c.p;}inc(){this.c.inc();}dec(){this.c.dec();}get(){return this.c.v;}set(v){this.c.v=v&255;}}
function runBF(src,inp){
  const tape=new BFTape();let ip=0,pp=0;const out=[];
  const O=new Map(),C=new Map();
  const stk=[];
  for(let i=0;i<src.length;i++){
    if(src[i]==='[')stk.push(i);
    else if(src[i]===']'){
      if(!stk.length)return{err:'unmatched ]'};
      const m=stk.pop();O.set(m,i);C.set(i,m);
    }
  }
  if(stk.length)return{err:'unmatched ['};
  let steps=0;
  while(ip<src.length){
    if(++steps>5000000)return{err:'execution limit reached'};
    switch(src[ip]){
      case'+':tape.inc();break;
      case'-':tape.dec();break;
      case'>':tape.right();break;
      case'<':tape.left();break;
      case'.':out.push(String.fromCharCode(tape.get()));break;
      case',':{tape.set(pp<inp.length?inp.charCodeAt(pp++):0);break;}
      case'[':if(tape.get()===0)ip=O.get(ip);break;
      case']':if(tape.get()!==0)ip=C.get(ip);break;
    }
    ip++;
  }
  return{out:out.join('')};
}

function tabComplete(){
  const val=UI.value;
  const parts=val.split(/\s+/);
  const completing=parts[parts.length-1];
  const isFirstWord=parts.length===1;
  if(isFirstWord){
    const matches=Object.keys(CMDS).filter(c=>c.startsWith(completing));
    if(matches.length===1){UI.value=matches[0]+' ';}
    else if(matches.length>1){println('root@cellOS:'+pathDisplay(CWD)+'# '+val);matches.forEach(m=>println(m));}
    return;
  }
  
  const base=completing.includes('/')?completing.slice(0,completing.lastIndexOf('/')+1):'';
  const stem=completing.includes('/')?completing.slice(completing.lastIndexOf('/')+1):completing;
  const searchDir=base?resolvePath(CWD,base):CWD;
  const node=getNode(searchDir);
  if(!node||node.type!=='d')return;
  const matches=Object.keys(node.content).filter(n=>n.startsWith(stem)&&!node.content[n].hidden);
  if(matches.length===1){
    const full=parts.slice(0,-1).concat([base+matches[0]+(node.content[matches[0]].type==='d'?'/':'')]).join(' ');
    UI.value=full;
  } else if(matches.length>1){
    println('root@cellOS:'+pathDisplay(CWD)+'# '+val);
    matches.forEach(m=>println(m+(node.content[m].type==='d'?'/':''),''));
  }
}

UI.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();tabComplete();return;}
  if(e.key==='Enter'){
    const raw=UI.value;const cmd=raw.trim();
    UI.value='';HIDX=-1;HTMP='';
    println('root@cellOS:'+pathDisplay(CWD)+'# '+raw);
    if(cmd){
      if(HIST[HIST.length-1]!==cmd)HIST.push(cmd);
      handleCommand(cmd);
    }
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(HIDX===-1){HTMP=UI.value;HIDX=HIST.length-1;}
    else if(HIDX>0)HIDX--;
    if(HIST[HIDX]!==undefined)UI.value=HIST[HIDX];
    return;
  }
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(HIDX===-1)return;
    HIDX++;
    UI.value=HIDX>=HIST.length?HTMP:HIST[HIDX];
    if(HIDX>=HIST.length)HIDX=-1;
    return;
  }
  if(e.key==='l'&&e.ctrlKey){e.preventDefault();T.innerHTML='';return;}
  if(e.key==='c'&&e.ctrlKey){e.preventDefault();println('root@cellOS:'+pathDisplay(CWD)+'# '+UI.value+'^C');UI.value='';return;}
});

function handleCommand(raw){
  
  if(raw.includes('&&')){
    const parts=raw.split('&&').map(s=>s.trim());
    for(const p of parts){const r=execSingle(p);if(r!==0)return;}
    return;
  }
  if(raw.includes('||')){
    const parts=raw.split('||').map(s=>s.trim());
    for(const p of parts){const r=execSingle(p);if(r===0)return;}
    return;
  }
  execSingle(raw);
}

function execSingle(raw){
  const parts=raw.trim().split(/\s+/);
  const c=parts[0];
  if(!c)return 0;
  if(CMDS[c]){CMDS[c](parts);return 0;}
  println('sh: '+c+': command not found','err');
  return 1;
}

    await new Promise(r=>setTimeout(r,d+Math.random()*10));
  }
  if(!bootDone)await doLogin();
}
